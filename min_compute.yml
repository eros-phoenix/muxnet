# Minimum hardware for the reference muxnet incentive.
# Miners return 2 * dummy_input and validators score that response.
# This is not a GPU training workload.

version: '1.0'

compute_spec:

  miner:

    cpu:
      min_cores: 2
      min_speed: 2.0
      recommended_cores: 4
      recommended_speed: 3.0
      architecture: "x86_64"

    gpu:
      required: False
      min_vram: 0
      recommended_vram: 0
      cuda_cores: 0
      min_compute_capability: 0
      recommended_compute_capability: 0
      recommended_gpu: ""

    memory:
      min_ram: 4
      min_swap: 0
      recommended_swap: 4
      ram_type: "DDR4"

    storage:
      min_space: 10
      recommended_space: 20
      type: "SSD"
      min_iops: 1000
      recommended_iops: 3000

    os:
      name: "Ubuntu"
      version: 22.04

  validator:

    cpu:
      min_cores: 2
      min_speed: 2.0
      recommended_cores: 4
      recommended_speed: 3.0
      architecture: "x86_64"

    gpu:
      required: False
      min_vram: 0
      recommended_vram: 0
      cuda_cores: 0
      min_compute_capability: 0
      recommended_compute_capability: 0
      recommended_gpu: ""

    memory:
      min_ram: 4
      min_swap: 0
      recommended_swap: 4
      ram_type: "DDR4"

    storage:
      min_space: 10
      recommended_space: 20
      type: "SSD"
      min_iops: 1000
      recommended_iops: 3000

    os:
      name: "Ubuntu"
      version: 22.04

network_spec:
  bandwidth:
    download: 100
    upload: 20
