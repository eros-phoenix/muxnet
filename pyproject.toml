[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = ["docs"]

[tool.ruff.lint]
# E501 is left to the existing Black 79-column layout. The selected rules
# catch broken imports, undefined names, and a few real bug risks.
select = ["E", "F", "I", "B"]
ignore = ["E501"]
